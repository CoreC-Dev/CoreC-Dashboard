<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src * ws: wss:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; script-src 'self' 'sha256-Xtud0sY1MHE9MWVP9W/re3IE1J0q2irGI4BZ5eG0mGU='; frame-ancestors 'none';"
    />
    <script>
  // Theme bootstrap (UX audit D-10) — must stay inline and synchronous: it
  // runs before the first paint so dark/midnight/forest users never flash a
  // light frame on refresh. Mirrors themeStore.applyThemeToDOM: data-theme
  // selects the CSS variable block (explicit variants keep their own name),
  // the .dark class toggles Tailwind dark: utilities. themeStore re-applies
  // the same values when its module loads — idempotent. The CSP meta above
  // pins this script's sha256 hash; keep both in sync (guarded by
  // src/themeBoot.test.ts).
  (function () {
    try {
      var theme = localStorage.getItem('corec_theme')
      var dark = theme === 'dark' || theme === 'dark-midnight' || theme === 'dark-forest'
      if (
        theme !== 'light' &&
        theme !== 'dark' &&
        theme !== 'light-sepia' &&
        theme !== 'light-nord' &&
        theme !== 'dark-midnight' &&
        theme !== 'dark-forest'
      ) {
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        theme = dark ? 'dark' : 'light'
      }
      document.documentElement.setAttribute('data-theme', theme)
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  })();
</script>
    <title>CoreC Dashboard — Industrial IoT Control Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Static splash (UX audit A-12): main.tsx waits for the proxy-mode
           probe (up to ~3s) before createRoot, and createRoot().render()
           clears pre-existing container children on mount — so this markup
           only ever occupies the white window before the app takes over.
           Inline styles only: the CSS bundle is not guaranteed to have been
           applied yet, so no CSS vars/classes can be relied on here. CSP
           note: style-src allows 'unsafe-inline'; no script is involved. -->
      <div
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;"
      >
        <img src="/logo-animated.svg" alt="CoreC" width="64" height="64" />
        <p style="margin:0;font-size:14px;color:#6b7280;">正在加载 CoreC Dashboard…</p>
        <p style="margin:0;font-size:12px;color:#9ca3af;">Loading CoreC Dashboard…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
